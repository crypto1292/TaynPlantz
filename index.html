<!doctype html>
<html lang="en">
<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#0d3324"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="TaynPlantz"
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <!-- iPhone / iPad Home Screen icon -->
  <link
    rel="apple-touch-icon"
    sizes="192x192"
    href="./icon-192.png"
  >

  <!-- PWA manifest -->
  <link
    rel="manifest"
    href="./manifest.json"
  >

  <title>TaynPlantz</title>

  <style>

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #0d3324;
    }

    body {
      color: white;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        system-ui,
        sans-serif;
    }

    .loading {
      min-height: 100vh;
      min-height: 100dvh;

      display: grid;
      place-items: center;

      text-align: center;

      padding:
        env(safe-area-inset-top)
        20px
        env(safe-area-inset-bottom);

      box-sizing: border-box;
    }

    .loading-inner {
      width: 100%;
      max-width: 360px;
    }

    .loading-icon {
      width: 96px;
      height: 96px;

      margin: 0 auto 20px;

      border-radius: 22px;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      background: #f5f8f3;

      box-shadow:
        0 12px 35px rgba(0,0,0,.25);
    }

    .loading-icon img {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: cover;
    }

    h1 {
      margin: 0;

      font-size: 30px;

      font-weight: 800;

      letter-spacing: -0.8px;
    }

    p {
      margin: 10px 0 0;

      opacity: .8;

      font-size: 14px;

      line-height: 1.5;
    }

  </style>

</head>

<body>

  <div class="loading">

    <div class="loading-inner">

      <div class="loading-icon">

        <img
          src="./icon-192.png"
          width="192"
          height="192"
          alt="TaynPlantz"
        >

      </div>

      <h1>
        TaynPlantz
      </h1>

      <p>
        Loading your plant intelligence...
      </p>

    </div>

  </div>

  <script>

    /*
     * ==========================================
     * TAYNPLANTZ PWA BOOT
     * ==========================================
     */

    (function () {

      /*
       * Register the service worker.
       *
       * Because this file is running from:
       *
       * https://crypto1292.github.io/TaynPlantz/
       *
       * "./service-worker.js" correctly resolves to:
       *
       * https://crypto1292.github.io/TaynPlantz/service-worker.js
       */

      if ("serviceWorker" in navigator) {

        window.addEventListener("load", function () {

          navigator.serviceWorker
            .register("./service-worker.js", {
              scope: "./"
            })
            .then(function (registration) {

              console.log(
                "TaynPlantz service worker registered:",
                registration.scope
              );

            })
            .catch(function (error) {

              console.error(
                "TaynPlantz service worker registration failed:",
                error
              );

            });

        });

      }


      /*
       * ==========================================
       * OPEN THE ACTUAL APP
       * ==========================================
       *
       * IMPORTANT:
       * The actual application file is lowercase:
       *
       * taynplantz.html
       */

      window.location.replace(
        "./taynplantz.html"
      );

    })();

  </script>

</body>
</html>
